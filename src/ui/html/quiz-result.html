<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini-LMS · Quiz result</title>
  <link rel="stylesheet" href="/ui/css/mini-lms.css" />
</head>

<body
  data-role="student"
  data-user-name="Student"
  data-user-email=""
  data-active="dashboard"
  data-brand-sub="Student"
  data-auth="required">

  <div class="app-shell">
    <div class="app-body">
      <main class="app-main">
        <div class="app-container" style="max-width: 640px;">

          <div class="page-head">
            <div>
              <h1 class="page-title" id="page-title">Quiz result</h1>
              <p class="page-sub" id="page-sub">Loading…</p>
            </div>
            <a class="btn btn--ghost" href="/ui/html/student-dashboard.html">
              ← Back to dashboard
            </a>
          </div>

          <div id="alert-area"></div>

          <section class="card" id="result-card" hidden>
            <div class="card__body" id="result-body"></div>
          </section>

          <section class="card" id="state-card">
            <div id="state-area">
              <div class="state">
                <span class="spinner" aria-hidden="true"></span>
                <div class="state__title u-mt-2">Loading result…</div>
              </div>
            </div>
          </section>

        </div>
      </main>
    </div>
  </div>

  <script src="/ui/js/layout.js"></script>
  <script src="/ui/js/api.js"></script>
  <script src="/ui/js/session.js"></script>
  <script src="/ui/js/quiz-result.js"></script>
  <script>
    document.body.dataset.userEmail = window.MiniLMS.Api.getEmail();
    Layout.init();
    Session.init();
  </script>
</body>
</html>
