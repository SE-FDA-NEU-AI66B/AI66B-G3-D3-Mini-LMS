<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini-LMS · Quiz Result</title>
  <link rel="stylesheet" href="/ui/css/mini-lms.css" />
</head>
<body
  data-role="student"
  data-user-name="Student"
  data-user-email=""
  data-active="dashboard"
  data-brand-sub="Student"
  data-auth="required">

  <div class="app-shell">
    <div class="app-body">
      <main class="app-main">
        <div class="app-container" style="max-width:600px;">

          <div class="card u-mt-6" style="text-align:center; padding: 40px 20px;">
            <h1 class="page-title u-text-muted" style="font-size: 18px;">
              Quiz Completed!
            </h1>

            <div id="score-display"
                 style="font-size: 64px; font-weight: bold;
                        color: var(--color-primary); margin: 20px 0;">
              -- / --
            </div>

            <div id="percent-display"
                 class="badge badge--active"
                 style="font-size: 18px; padding: 8px 16px;">
              -- %
            </div>

            <p class="u-text-muted u-mt-6" id="auto-msg"></p>

            <div class="u-mt-6">
              <a href="/ui/html/student-dashboard.html"
                 class="btn btn--primary">Back to Dashboard</a>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="/ui/js/layout.js"></script>
  <script src="/ui/js/api.js"></script>
  <script src="/ui/js/session.js"></script>
  <script src="/ui/js/quiz-result.js"></script>
  <script>
    document.body.dataset.userEmail = window.MiniLMS.Api.getEmail();
    Layout.init();
    Session.init();
  </script>
</body>
</html>
