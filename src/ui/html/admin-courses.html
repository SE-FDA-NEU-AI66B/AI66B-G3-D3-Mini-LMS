<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini-LMS · Courses</title>
  <link rel="stylesheet" href="/ui/css/mini-lms.css" />
</head>

<body
  data-role="admin"
  data-user-name="Administrator"
  data-user-email=""
  data-active="courses"
  data-brand-sub="Admin"
  data-auth="required">

  <div class="app-shell">
    <div class="app-body">
      <main class="app-main">
        <div class="app-container">

          <div class="page-head">
            <div>
              <h1 class="page-title">Courses</h1>
              <p class="page-sub">
                Courses with their lecturer and enrolled students.
              </p>
            </div>
            <button class="btn btn--ghost" type="button" id="refresh-btn">
              Refresh
            </button>
          </div>

          <div id="alert-area"></div>

          <section class="card">
            <div class="card__head">
              <div>
                <h2 class="card__title">All courses</h2>
                <p class="card__hint" id="courses-summary">Loading…</p>
              </div>
            </div>
            <div id="list-area">
              <div class="state">
                <span class="spinner" aria-hidden="true"></span>
                <div class="state__title u-mt-2">Loading courses…</div>
              </div>
            </div>
          </section>

        </div>
      </main>
    </div>
  </div>

  <div id="modal-backdrop" class="sidebar-backdrop"></div>

  <!-- ============================== Roster modal ============================== -->
  <!-- Outer wrapper centers; the card is capped at viewport height so the -->
  <!-- Close button stays visible. The card body scrolls internally when -->
  <!-- the roster has many students. -->
  <div id="roster-modal"
       style="position:fixed; inset:0; z-index:60; display:none;
              align-items:center; justify-content:center; padding:20px;
              overflow-y:auto;">
    <div class="card"
         style="width:100%; max-width:820px; margin:0;
                max-height:calc(100vh - 40px);
                display:flex; flex-direction:column;">
      <div class="card__head" style="flex-shrink:0;">
        <div>
          <h2 class="card__title" id="roster-title">Course roster</h2>
          <p class="card__hint" id="roster-sub"></p>
        </div>
        <button class="btn btn--ghost btn--sm" type="button" id="modal-close">Close</button>
      </div>

      <div class="card__body" id="roster-body"
           style="overflow-y:auto; flex:1 1 auto; min-height:0;">
        <div class="state">
          <span class="spinner" aria-hidden="true"></span>
          <div class="state__title u-mt-2">Loading roster…</div>
        </div>
      </div>
    </div>
  </div>

  <script src="/ui/js/layout.js"></script>
  <script src="/ui/js/api.js"></script>
  <script src="/ui/js/session.js"></script>
  <script src="/ui/js/admin-courses.js"></script>
  <script>
    document.body.dataset.userEmail = window.MiniLMS.Api.getEmail();
    Layout.init();
    Session.init();
  </script>
</body>
</html>
