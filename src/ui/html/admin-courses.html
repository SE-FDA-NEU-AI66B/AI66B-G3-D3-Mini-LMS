<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini-LMS · Courses</title>
  <link rel="stylesheet" href="/ui/css/mini-lms.css" />
</head>

<body
  data-role="admin"
  data-user-name="Administrator"
  data-user-email=""
  data-active="courses"
  data-brand-sub="Admin"
  data-auth="required">

  <div class="app-shell">
    <div class="app-body">
      <main class="app-main">
        <div class="app-container">

          <div class="page-head">
            <div>
              <h1 class="page-title">Courses</h1>
              <p class="page-sub">
                Courses with their lecturer and enrolled students.
              </p>
            </div>
            <button class="btn btn--ghost" type="button" id="refresh-btn">
              Refresh
            </button>
          </div>

          <div id="alert-area"></div>

          <section class="card">
            <div class="card__head">
              <div>
                <h2 class="card__title">All courses</h2>
                <p class="card__hint" id="courses-summary">Loading…</p>
              </div>
            </div>
            <div id="list-area">
              <div class="state">
                <span class="spinner" aria-hidden="true"></span>
                <div class="state__title u-mt-2">Loading courses…</div>
              </div>
            </div>
          </section>

        </div>
      </main>
    </div>
  </div>

  <div id="modal-backdrop" class="sidebar-backdrop"></div>

  <!-- ============================== Roster modal ============================== -->
  <!-- Outer wrapper centers; the card is capped at viewport height so the -->
  <!-- Close button stays visible. The card body scrolls internally when -->
  <!-- the roster has many students. -->
  <div id="roster-modal"
       style="position:fixed; inset:0; z-index:60; display:none;
              align-items:center; justify-content:center; padding:20px;
              overflow-y:auto;">
    <div class="card"
         style="width:100%; max-width:820px; margin:0;
                max-height:calc(100vh - 40px);
                display:flex; flex-direction:column;">
      <div class="card__head" style="flex-shrink:0;">
        <div>
          <h2 class="card__title" id="roster-title">Course roster</h2>
          <p class="card__hint" id="roster-sub"></p>
        </div>
        <div class="u-flex u-gap-2">
          <!-- NÚT MỚI: Thêm sinh viên -->
          <button class="btn btn--primary btn--sm" type="button" id="add-student-btn">
            + Add student
          </button>
          <button class="btn btn--ghost btn--sm" type="button" id="modal-close">Close</button>
        </div>
      </div>

      <div id="roster-alert" class="u-mt-4" style="padding: 0 20px;"></div>

      <div class="card__body" id="roster-body"
           style="overflow-y:auto; flex:1 1 auto; min-height:0;">
        <div class="state">
          <span class="spinner" aria-hidden="true"></span>
          <div class="state__title u-mt-2">Loading roster…</div>
        </div>
      </div>
    </div>
  </div>

    <!-- ============================== Add Student Modal ============================== -->
  <div id="add-student-modal"
       style="position:fixed; inset:0; z-index:70; display:none;
              align-items:center; justify-content:center; padding:20px;
              overflow-y:auto;">
    <div class="card" style="width:100%; max-width:480px; margin:0;">
      <div class="card__head">
        <h2 class="card__title">Add student to course</h2>
        <button class="btn btn--ghost btn--sm" type="button" id="add-student-close">Close</button>
      </div>
      <div class="card__body">
        <form id="add-student-form" novalidate>
          <div class="field">
            <label for="student-email">Student email <span class="req">*</span></label>
            <input class="input" id="student-email" type="email" placeholder="minhhd@univ.edu" required />
            <div class="field__help">Enter the email of an active student account.</div>
          </div>
          <div class="u-mt-4 u-flex u-justify-between u-items-center">
            <div class="field__error" id="add-student-error" hidden></div>
            <div class="u-flex u-gap-2">
              <button type="button" class="btn btn--ghost" id="add-student-cancel">Cancel</button>
              <button type="submit" class="btn btn--primary" id="add-student-save">Add to course</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
  
  <script src="/ui/js/layout.js"></script>
  <script src="/ui/js/api.js"></script>
  <script src="/ui/js/session.js"></script>
  <script src="/ui/js/admin-courses.js"></script>
  <script>
    document.body.dataset.userEmail = window.MiniLMS.Api.getEmail();
    Layout.init();
    Session.init();
  </script>
</body>
</html>
