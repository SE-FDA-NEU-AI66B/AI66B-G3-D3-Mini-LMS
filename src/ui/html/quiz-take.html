<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini-LMS · Take quiz</title>
  <link rel="stylesheet" href="/ui/css/mini-lms.css" />
</head>

<body
  data-role="student"
  data-user-name="Student"
  data-user-email=""
  data-active="dashboard"
  data-brand-sub="Student"
  data-auth="required">

  <div class="app-shell">
    <div class="app-body">
      <main class="app-main">
        <div class="app-container" style="max-width:820px;">

          <div class="page-head">
            <div>
              <h1 class="page-title" id="quiz-title">Loading…</h1>
              <p class="page-sub" id="quiz-sub"></p>
            </div>
            <a class="btn btn--ghost" href="/ui/html/student-dashboard.html">
              ← Back
            </a>
          </div>

          <!-- Sticky timer bar -->
          <section class="card" id="timer-card" hidden
                   style="position: sticky; top: 68px; z-index: 20;">
            <div class="card__body"
                 style="display:flex; justify-content:space-between;
                        align-items:center; flex-wrap:wrap; gap:12px;">
              <div class="u-flex u-gap-3 u-items-center">
                <span class="u-text-sm u-text-muted">Time remaining</span>
                <span id="timer-display"
                      style="font-family: var(--font-mono);
                             font-size: 24px; font-weight: 600;
                             font-variant-numeric: tabular-nums;">
                  00:00
                </span>
              </div>
              <button class="btn btn--primary" type="button" id="submit-btn">
                Submit quiz
              </button>
            </div>
          </section>

          <div id="alert-area"></div>

          <!-- Navigator -->
          <section class="card" id="navigator-card" hidden>
            <div class="card__head">
              <div>
                <h2 class="card__title">Questions</h2>
                <p class="card__hint" id="progress-summary"></p>
              </div>
            </div>
            <div class="card__body">
              <div id="navigator" class="u-flex u-gap-2"
                   style="flex-wrap: wrap;"></div>
            </div>
          </section>

          <!-- Current question -->
          <section class="card" id="question-card" hidden>
            <div class="card__body" id="question-body"></div>
            <div class="card__foot u-flex u-justify-between">
              <button class="btn btn--ghost" type="button" id="prev-btn">
                ← Previous
              </button>
              <button class="btn btn--primary" type="button" id="next-btn">
                Next →
              </button>
            </div>
          </section>

          <!-- Loading / error state -->
          <section class="card" id="state-card">
            <div id="state-area">
              <div class="state">
                <span class="spinner" aria-hidden="true"></span>
                <div class="state__title u-mt-2">Loading attempt…</div>
              </div>
            </div>
          </section>

        </div>
      </main>
    </div>
  </div>

  <script src="/ui/js/layout.js"></script>
  <script src="/ui/js/api.js"></script>
  <script src="/ui/js/session.js"></script>
  <script src="/ui/js/quiz-take.js"></script>
  <script>
    document.body.dataset.userEmail = window.MiniLMS.Api.getEmail();
    Layout.init();
    Session.init();
  </script>
</body>
</html>
